<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YexoFX</title>
<link rel="stylesheet" href="css/yexofx.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>
<div class="panel app" id="panel">
  <nav class="rail" id="rail" aria-label="Navigation">
    <div class="rail-logo"><span id="headLogo"></span><span class="wm">Yexo<b>FX</b></span></div>
    <button class="rail-btn" id="btnHome" type="button" title="Accueil" aria-label="Accueil" aria-pressed="false"></button>
    <div class="rail-cats" id="cats"></div>
    <div class="rail-foot">
      <button class="rail-btn" id="btnSettings" type="button" title="Réglages" aria-label="Réglages" aria-pressed="false"></button>
      <button class="rail-btn" id="btnRail" type="button" title="Afficher les libellés" aria-label="Afficher les libellés"></button>
    </div>
  </nav>

  <main class="main">
    <header class="top">
      <div class="crumb" id="crumb"></div>
      <button class="search-btn" id="btnSearch" type="button" aria-label="Rechercher (Ctrl+K)"><span id="searchIco"></span><span class="txt">Rechercher</span><kbd>Ctrl K</kbd></button>
      <button class="ibtn" id="btnHistory" type="button" title="Historique de la session (annuler)" aria-label="Historique"></button>
      <button class="ibtn" id="btnAuto" type="button" aria-pressed="false" title="Previews : au survol"></button>
    </header>

    <div class="banner" id="banner" hidden></div>

    <div class="p-scroll" id="scroll"><section id="view"></section></div>

    <footer class="dock" id="dock">
      <div class="dock-int">
        <span class="label">Intensité</span>
        <input class="range" id="intensity" type="range" min="0" max="200" step="5" value="100" aria-label="Intensité">
        <output id="intensityV">100 %</output>
      </div>
      <button class="dock-curve" id="btnCurve" type="button" title="Courbe par défaut : clique pour l'éditer">
        <svg viewBox="0 0 40 26" aria-hidden="true"><path id="dockCurve"/></svg>
        <span id="curveV">Back</span>
      </button>
    </footer>

    <footer class="statusbar">
      <span class="st-dot wait" id="status" title="État"></span>
      <button class="ctx-line" id="ctx" type="button" title="Comp active et sélection (clique pour rafraîchir)">connexion à After Effects…</button>
      <span class="ver" id="ver">v1.0</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="pal" id="pal" hidden>
    <div class="pal-card" role="dialog" aria-modal="true" aria-label="Rechercher">
      <label class="pal-in"><span id="palIco"></span><input id="q" type="search" placeholder="Preset, son, page, réglage…" autocomplete="off" spellcheck="false" aria-label="Rechercher" aria-controls="palList"><kbd>Échap</kbd></label>
      <div class="pal-list" id="palList" role="listbox"></div>
      <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> choisir</span><span><kbd>↵</kbd> ouvrir</span><span><kbd>Maj</kbd><kbd>↵</kbd> voir en cartes</span></div>
    </div>
  </div>
  <div class="sheet" id="sheet" hidden></div>

  <div class="gate" id="gate" hidden>
    <span id="gateLogo"></span>
    <div>
      <h2>Active Yexo<b>FX</b></h2>
      <div class="cmd" style="margin-top:6px">Une clé par PC, vérifiée sans connexion.</div>
    </div>
    <div class="step"><b>1.</b> Envoie ton ID machine à Yexo (Discord Edits).</div>
    <div class="mid"><code id="mid">…</code><button class="mini" type="button" id="midCopy">Copier</button></div>
    <div class="step"><b>2.</b> Colle ici la clé que tu reçois.</div>
    <form id="gateForm" novalidate>
      <textarea class="key long" id="key" spellcheck="false" placeholder="YFX1.…" aria-label="Clé de licence" aria-describedby="keyErr"></textarea>
      <div class="err" id="keyErr"></div>
      <button class="btn primary" id="keyBtn" type="submit">Activer</button>
    </form>
  </div>
</div>

<script src="js/pubkey.js"></script>
<script src="js/catalog.data.js"></script>
<script src="js/catalog.js"></script>
<script src="js/search.js"></script>
<script src="js/store.js"></script>
<script src="js/bridge.js"></script>
<script src="js/previews.js"></script>
<script src="js/pvgen.js"></script>
<script src="js/licence.js"></script>
<script src="js/app.js"></script>
</body>
</html>
